<style>
/* PLATE — the design system for every surface.

   Light is the identity. Tonight is the one saturated card on the page and everything
   else sits quiet around it: every screen is cards on the GROUND, and nothing is
   separated by a hairline. The oven chamber this file opened with was the previous answer: a dark, hot
   box for Tonight. It read well and it fought the rule that light comes first, so the
   heat moved to the action and the plate took the card. DESIGN.md has the whole system.
   The previous system carried every division on a 0.33px rule at 1.26:1 contrast, which is
   invisible on a phone in daylight. Ember is heat and the single action that matters. Frost
   is everything cold: the freezer, the block eaten while the oven runs, stock on hand.

   Inlined into every page at serve time by plate.dress(), so a page cannot half-load and the
   phone needs no second request to look right.

   The typefaces are self-hosted in ui/fonts and named by role, not by family: one sans for
   everything written for a person, and a mono for figures, codes and anything the oven
   would display. The serif the sentences used to be set in went with the Markers step. */

/* Self-hosted, subset to the characters this app prints. Before these were local the pages
   fetched three families from Google and fell back to Helvetica the moment the phone lost
   signal. The fallbacks below are metric-matched to what a Mac and an iPhone actually have,
   so a first paint before the files arrive changes the texture and not the layout. */
@font-face{font-family:'Plate Sans';src:url('fonts/plate-sans.woff2') format('woff2-variations'),
  url('fonts/plate-sans.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
@font-face{font-family:'Plate Sans';src:url('fonts/plate-italic.woff2') format('woff2');
  font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Plate Mono';src:url('fonts/plate-mono.woff2') format('woff2-variations'),
  url('fonts/plate-mono.woff2') format('woff2');font-weight:400 600;font-style:normal;font-display:swap}

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  TOKENS — the design system. ui/design.html is its specimen and the   ║
   ║  place to look at it; this is where it runs. Adoption is by screen:   ║
   ║  the tokens land first, the components follow one surface at a time.  ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
:root{
  color-scheme: light;

  /* Ground and surface. A section is separated by its GROUND, never by a line. */
  --enamel:#F2F2EF; --surface:#FFFFFF; --sunk:#E7E8E2; --hair:#E4E5DE;
  --ink:#12150E; --ink-2:#4B5045; --ink-3:#7C8274;

  /* FAMILIES, one per domain. Five tones, five jobs:
       wash  tile and pill background            (near-black, or the family ink)
       lit   hero fill, light chart bar          (near-black text on it)
       core  glyph, heavy chart bar, dot         (NEVER a text background)
       deep  the one fill that carries white text    (AA measured)
       ink   the family as text on white or wash     (AA measured)          */
  --sprout-wash:#EAF6D2; --sprout-lit:#B6E44F; --sprout:#79B517; --sprout-deep:#4F7A0C; --sprout-ink:#3F6606;
  --ember-wash:#FDE7E0;  --ember-lit:#FF8A6B;  --ember:#EE6B4D;  --ember-deep:#C0472A;  --ember-ink:#A33A20;
  --frost-wash:#E1F0F7;  --frost-lit:#9FCFE6;  --frost:#4A9BC4;  --frost-deep:#2A7BA6;  --frost-ink:#1F5C80;
  --clay-wash:#F0E8DA;   --clay-lit:#D9C7A8;   --clay:#A8875C;   --clay-deep:#8A6A3C;   --clay-ink:#6B5028;
  --plum-wash:#F5E5EA;   --plum-lit:#D9AEBD;   --plum:#9C6B7E;   --plum-deep:#7E4A5D;   --plum-ink:#6A3A4C;

  --on-lit:#12150E;      /* text on any -wash or -lit */
  --on-deep:#FFFFFF;     /* text on any -deep, and nowhere else */

  /* The plate: ceramic lit from the top left, and the shade it casts. The landing page's own
     drawing (icons.svg, mp-base and one mark per family) reads these. */
  --plate:#FFFFFF; --plate-rim:#ECEDE7; --plate-edge:#D5D7CF; --plate-well:#E3E5DE; --shade:#12150E;

  /* Radius. Concentric: an inner radius is the outer minus its padding. */
  --r-xs:8px; --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px; --r-pill:999px;

  /* Space, 4pt. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:44px; --s9:64px;
  --gutter:16px; --gap:12px;

  /* Lift. Soft, wide, low. A card is lifted, never outlined. */
  --lift-1:0 1px 2px rgba(18,21,14,.04), 0 6px 16px rgba(18,21,14,.05);
  --lift-2:0 2px 6px rgba(18,21,14,.06), 0 18px 40px rgba(18,21,14,.10);
  --lift-3:0 8px 20px rgba(18,21,14,.10), 0 34px 70px rgba(18,21,14,.18);

  --sans:'Plate Sans','Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'Plate Mono','DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  /* Motion. Four durations, three curves. */
  --d-press:120ms; --d-state:220ms; --d-enter:380ms; --d-hero:620ms;
  --ez:cubic-bezier(.22,.72,.24,1);           /* the default */
  --ez-out:cubic-bezier(.16,1,.3,1);          /* arrivals */
  --ez-spring:cubic-bezier(.34,1.42,.5,1);    /* commitment */

  /* The nav is 58 here and 66 in the specimen: 66 is the height a raised centre
     action needs, and it arrives with the screen that adopts one. He reported the
     bar being too tall once already, so it does not grow before then. */
  --navh:58px; --masth:44px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    color-scheme: dark;
    --enamel:#101210; --surface:#191C18; --sunk:#0B0D0A; --hair:#262A24;
    --ink:#E9ECE4; --ink-2:#B0B6A9; --ink-3:#868D80;
    --sprout-wash:#1C2609; --sprout-lit:#A9DB52; --sprout:#8AC72A; --sprout-deep:#6FA512; --sprout-ink:#BCE472;
    --ember-wash:#2A1610;  --ember-lit:#FF9C80;  --ember:#F2795D;  --ember-deep:#DC5636;  --ember-ink:#FFA588;
    --frost-wash:#0F2330;  --frost-lit:#8FC7E2;  --frost:#5FAAD0;  --frost-deep:#3E8FBA;  --frost-ink:#95CDE8;
    --clay-wash:#241D12;   --clay-lit:#CBB694;   --clay:#BC9A6B;   --clay-deep:#9E7C4A;   --clay-ink:#D9C09A;
    --plum-wash:#241820;   --plum-lit:#CD9DAE;   --plum:#B27E92;   --plum-deep:#95596E;   --plum-ink:#D7A9BA;
    --on-lit:#12150E; --on-deep:#0B0D0A;
    --plate:#ECEEE8; --plate-rim:#D3D6CD; --plate-edge:#B6BAAF; --plate-well:#CBCFC4; --shade:#E9ECE4;
    --lift-1:0 1px 2px rgba(0,0,0,.40), 0 6px 16px rgba(0,0,0,.30);
    --lift-2:0 2px 6px rgba(0,0,0,.50), 0 18px 40px rgba(0,0,0,.40);
    --lift-3:0 8px 20px rgba(0,0,0,.55), 0 34px 70px rgba(0,0,0,.50);
}}
:root[data-theme="dark"]{
    color-scheme: dark;
    --enamel:#101210; --surface:#191C18; --sunk:#0B0D0A; --hair:#262A24;
    --ink:#E9ECE4; --ink-2:#B0B6A9; --ink-3:#868D80;
    --sprout-wash:#1C2609; --sprout-lit:#A9DB52; --sprout:#8AC72A; --sprout-deep:#6FA512; --sprout-ink:#BCE472;
    --ember-wash:#2A1610;  --ember-lit:#FF9C80;  --ember:#F2795D;  --ember-deep:#DC5636;  --ember-ink:#FFA588;
    --frost-wash:#0F2330;  --frost-lit:#8FC7E2;  --frost:#5FAAD0;  --frost-deep:#3E8FBA;  --frost-ink:#95CDE8;
    --clay-wash:#241D12;   --clay-lit:#CBB694;   --clay:#BC9A6B;   --clay-deep:#9E7C4A;   --clay-ink:#D9C09A;
    --plum-wash:#241820;   --plum-lit:#CD9DAE;   --plum:#B27E92;   --plum-deep:#95596E;   --plum-ink:#D7A9BA;
    --on-lit:#12150E; --on-deep:#0B0D0A;
    --plate:#ECEEE8; --plate-rim:#D3D6CD; --plate-edge:#B6BAAF; --plate-well:#CBCFC4; --shade:#E9ECE4;
    --lift-1:0 1px 2px rgba(0,0,0,.40), 0 6px 16px rgba(0,0,0,.30);
    --lift-2:0 2px 6px rgba(0,0,0,.50), 0 18px 40px rgba(0,0,0,.40);
    --lift-3:0 8px 20px rgba(0,0,0,.55), 0 34px 70px rgba(0,0,0,.50);
}

/* One attribute recolours a card, a screen, a whole domain. A sixth domain — a
   second eater, a new regimen — is one more line here, not a rewrite. */
[data-family="sprout"]{--wash:var(--sprout-wash);--lit:var(--sprout-lit);--core:var(--sprout);--deep:var(--sprout-deep);--fam-ink:var(--sprout-ink)}
[data-family="ember"] {--wash:var(--ember-wash); --lit:var(--ember-lit); --core:var(--ember); --deep:var(--ember-deep); --fam-ink:var(--ember-ink)}
[data-family="frost"] {--wash:var(--frost-wash); --lit:var(--frost-lit); --core:var(--frost); --deep:var(--frost-deep); --fam-ink:var(--frost-ink)}
[data-family="clay"]  {--wash:var(--clay-wash);  --lit:var(--clay-lit);  --core:var(--clay);  --deep:var(--clay-deep);  --fam-ink:var(--clay-ink)}
[data-family="plum"]  {--wash:var(--plum-wash);  --lit:var(--plum-lit);  --core:var(--plum);  --deep:var(--plum-deep);  --fam-ink:var(--plum-ink)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--enamel);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:5px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  COMPONENTS — the specimen's parts, adopted screen by screen. Each   ║
   ║  arrives with the first screen that needs it: the Rotation brought   ║
   ║  the type scale, card, chip, stat, row, pill, strip and stack.       ║
   ║  The Kitchen brought the button, iconbtn, tiles, bars, gauge, pile.  ║
   ║  Markers brought the range scale, the spark, the chips as pills.     ║
   ║  Tonight brought the tick and the arrival; every tab is cards now.   ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

/* TYPE — one family. Enormous number, tiny label. */
.t-hero   {font-size:56px;line-height:.92;font-weight:780;letter-spacing:-.035em}
.t-display{font-size:34px;line-height:1.04;font-weight:720;letter-spacing:-.028em}
.t-title  {font-size:22px;line-height:1.16;font-weight:660;letter-spacing:-.018em}
.t-head   {font-size:17px;line-height:1.26;font-weight:620;letter-spacing:-.011em}
.t-body   {font-size:15px;line-height:1.5;font-weight:450}
.t-note   {font-size:13px;line-height:1.38;font-weight:480;color:var(--ink-2)}
.t-label  {font-size:11px;line-height:1;font-weight:680;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.t-unit   {font-size:13px;font-weight:560;color:var(--ink-3);letter-spacing:0}
.mono     {font-family:var(--mono);font-size:12px;letter-spacing:-.01em}

/* CARD — four weights. A screen carries at most ONE lit or solid card. */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--lift-1);
  position:relative;overflow:hidden}
/* a jump to a card (a tile on Kitchen) lands it under the masthead, not behind it */
.card{scroll-margin-top:calc(var(--masth) + env(safe-area-inset-top) + var(--s3))}
/* a card that is a tap (a way in, a deadline) is a button, and reads like the rest */
button.card{width:100%;text-align:left}
.card--tint {background:var(--wash);box-shadow:none}
.card--lit  {background:var(--lit);color:var(--on-lit);box-shadow:var(--lift-2)}
.card--solid{background:var(--deep);color:var(--on-deep);box-shadow:var(--lift-2)}
.card--lit .t-label,.card--solid .t-label{color:inherit;opacity:.62}
.card--lit .t-note, .card--solid .t-note {color:inherit;opacity:.72}
.card--lit .t-unit, .card--solid .t-unit {color:inherit;opacity:.66}
.card--tint .t-label{color:var(--fam-ink);opacity:.75}
.split{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}

/* THE PLATE — the landing page's drawing, one base and a mark per family, the family colour set
   on the svg element itself (data-family). Tonight's hero carries it large; a rotation row
   carries it as its thumb. */
.mp{display:block;width:100%;height:auto;aspect-ratio:1}
.mp--lg{width:96px}
.mp--sm{width:44px;flex:none}
.hero-plate{position:absolute;right:var(--s4);top:var(--s4);width:112px;z-index:1;
  filter:drop-shadow(0 10px 16px rgba(18,21,14,.16))}
.hero-plate .mp{width:100%}
.hero .hero-in{padding-right:120px}
/* the interview's hero is a heading, not a plate: smaller type, no plate, no right inset */
.hero--setup .mealname{font-size:clamp(30px,8.6vw,38px)}
.hero--setup .mealsub{font-size:16px}
.hero--setup .hero-in{padding-right:0}
.hero .readout{margin-right:-120px}
.row__thumb .mp{position:absolute;inset:2px;width:auto}
@media (min-width:900px){.hero-plate{width:150px;right:var(--s5);top:var(--s5)}.hero .hero-in{padding-right:164px}.hero .readout{margin-right:-164px}}

/* MOTIF — the plate seen from above in the family's own colours, until there is a photograph. */
.motif{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 76% 30%, color-mix(in srgb,var(--lit) 92%, transparent) 0 26%, transparent 26.5%),
    radial-gradient(circle at 76% 30%, transparent 0 34%, color-mix(in srgb,var(--lit) 55%, transparent) 34.5% 38%, transparent 38.5%),
    radial-gradient(circle at 76% 30%, transparent 0 46%, color-mix(in srgb,var(--lit) 26%, transparent) 46.5% 48%, transparent 48.5%),
    linear-gradient(140deg, color-mix(in srgb,var(--wash) 90%, transparent), transparent 62%)}

/* CHIP — an icon in a soft holder. The glyph is the family core. */
.chip{width:38px;height:38px;border-radius:var(--r-sm);background:var(--wash);color:var(--core);
  display:grid;place-items:center;flex:none}
.chip--round{border-radius:var(--r-pill)}
.chip--lg{width:46px;height:46px;border-radius:var(--r-md)}
.chip--onlit{background:rgba(255,255,255,.42);color:var(--on-lit)}
.chip--onsolid{background:rgba(255,255,255,.18);color:var(--on-deep)}
.chip--ontint{background:color-mix(in srgb,var(--surface) 55%, transparent)}   /* the glyph stays the family core */
.chip svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chip--lg svg{width:24px;height:24px}

/* STAT — a label, a number set large, a quiet unit. */
.stat{display:flex;flex-direction:column;gap:var(--s2)}
.num{font-weight:780;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums}
.num--xl{font-size:52px}
.num--lg{font-size:34px}
.num--md{font-size:26px}
.num.word{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.numrow{display:flex;align-items:baseline;gap:var(--s2)}

/* ROW — a list item: a thumb or a chip, two lines, a trailing control. */
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--hair)}
.row__body{flex:1;min-width:0}
.row__title{display:block;font-size:15.5px;font-weight:620;letter-spacing:-.012em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__meta{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__note{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-2);font-weight:500;margin-top:4px}
.row__thumb{width:52px;height:52px;border-radius:var(--r-sm);flex:none;position:relative;overflow:hidden;
  background:var(--wash)}
.row__thumb .motif{border-radius:inherit}

/* PILL — a state, never a verdict. Outside a family it is the ghost pill; the two states the
   ingest and draw tables mark are restated here. */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);
  background:var(--wash,var(--sunk));color:var(--fam-ink,var(--ink-2));font-size:11.5px;font-weight:660;
  letter-spacing:-.005em;flex:none;white-space:nowrap}
.pill--ghost{background:var(--sunk);color:var(--ink-2)}
.pill.hot{background:var(--ember-wash);color:var(--ember-ink)}
.pill.ok{background:var(--sprout-wash);color:var(--sprout-ink)}
.dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--core);flex:none}

/* STRIP — the rotation, not a week (spec §7). The current meal is the one deep fill, meals
   already logged sit behind it, and every number is a meal, never a day. */
.strip{display:flex;gap:var(--s1);justify-content:space-between}
.strip button{flex:1;padding:var(--s2) 0;border-radius:var(--r-md);text-align:center;
  transition:background-color var(--d-state) var(--ez),color var(--d-state) var(--ez)}
.strip span{display:block;font-size:10.5px;font-weight:640;color:var(--ink-3);letter-spacing:.04em}
.strip b{display:block;font-size:15px;font-weight:660;margin-top:3px;letter-spacing:-.01em}
.strip [aria-current]{background:var(--deep);color:var(--on-deep)}
.strip [aria-current] span{color:inherit;opacity:.7}
.strip [data-logged]{color:var(--ink-3);cursor:default}
.strip--meals b{margin-top:0}
/* on a lit card the buttons get a faint holder and logged meals recede in the card's own ink */
.strip--onlit button{background:rgba(255,255,255,.34)}
.strip--onlit [data-logged]{color:var(--on-lit);opacity:.5;background:rgba(255,255,255,.18)}
.strip--onlit [aria-current]{background:var(--deep);color:var(--on-deep);opacity:1}

/* STACK — a screen made of cards: one column on the phone, hero and aside beside the main
   column on the Mac (the wide rule is with the other wide rules at the end). */
.stack{display:grid;grid-template-columns:1fr;grid-template-areas:"hero" "main" "aside";gap:var(--gap);
  padding:12px var(--gutter) var(--s6)}
.a-hero{grid-area:hero}.a-main{grid-area:main}.a-aside{grid-area:aside}

/* PILE — a stack inside a stack area: several cards where the grid gives one slot. */
.pile{display:grid;gap:var(--gap);align-content:start}

/* TILES — the ways in. One per store, one per zone: muted, tappable, a number each. An odd
   last tile takes the whole row rather than leaving a hole. */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile{background:var(--wash);border-radius:var(--r-lg);padding:var(--s4);min-height:132px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  transition:transform var(--d-press) var(--ez)}
.tile:active,.tile.pressed{transform:scale(.972)}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile__top{display:flex;align-items:flex-start;justify-content:space-between}
.tile__ico{color:var(--core)}
.tile__ico svg{width:24px;height:24px;stroke-width:1.5}
.tile__go{width:30px;height:30px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--core) 16%, transparent);
  color:var(--fam-ink);display:grid;place-items:center}
.tile__go svg{width:15px;height:15px;stroke-width:1.8}
.tile__t{display:block;font-size:19px;font-weight:680;letter-spacing:-.02em;color:var(--ink)}
.tile__s{display:block;font-size:12.5px;color:var(--fam-ink);font-weight:520;margin-top:2px}

/* BARS — rounded caps in the family core and a hatched ghost for the line behind them. The
   markup carries the finished height; a bump redraws them from zero, because that is the action. */
.bars{display:flex;align-items:flex-end;gap:var(--s2);height:96px}
.barcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:var(--s2);height:100%;
  justify-content:flex-end}
.bartrack{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.ghost{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46%;border-radius:var(--r-pill);
  background:repeating-linear-gradient(-45deg,color-mix(in srgb,currentColor 22%,transparent) 0 2px,transparent 2px 5px)}
.bar{position:relative;width:46%;border-radius:var(--r-pill);background:var(--lit)}
.bar--core{background:var(--core)}
.barcap{font-size:10.5px;font-weight:640;color:var(--ink-3);position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(100% + 5px);white-space:nowrap}
.barlbl{font-size:11px;font-weight:600;color:var(--ink-3);max-width:100%;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.card--lit .barcap,.card--lit .barlbl{color:var(--on-lit);opacity:.72}
.bars.fill .bar{animation:barfill var(--d-hero) var(--ez-out) both}
@keyframes barfill{from{height:0}}

/* GAUGE — the slim track under a stock row: how much of the pack is left. Core on sunk; low
   is ember; an item being eaten down on purpose is ink. */
.gauge{display:block;height:5px;max-width:220px;border-radius:var(--r-pill);background:var(--sunk);margin-top:7px;
  overflow:hidden}
.gauge i{display:block;height:100%;border-radius:inherit;background:var(--core,var(--frost))}
.gauge i.low{background:var(--ember)}
.gauge i.out{background:var(--ink-3)}
.row__note--hot{color:var(--ember-ink)}
.row__val{font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}

/* SCALE — a marker against the range the lab printed on that report, never one this app
   invented. The band is that range in the family's lit tone, the dot is the number in its core,
   the tick is the draw before, and the band's own two numbers sit under its edges. No colour in
   it means good or bad. The dot is emitted in place; it springs in only on the render after a
   report is committed, because that is the action. */
.scale{padding-top:var(--s5)}
.scaletrack{position:relative;height:10px;border-radius:var(--r-pill);background:var(--sunk)}
.scaleband{position:absolute;top:0;bottom:0;border-radius:var(--r-pill);background:var(--lit)}
.scaledot{position:absolute;top:50%;width:18px;height:18px;border-radius:var(--r-pill);background:var(--core);
  box-shadow:0 0 0 3.5px var(--surface),var(--lift-1);transform:translate(-50%,-50%)}
.scale.fill .scaledot{animation:dotin var(--d-hero) var(--ez-spring) 120ms both}
@keyframes dotin{from{transform:translate(-50%,-50%) scale(0)}}
.scaleprev{position:absolute;top:-9px;width:2px;height:7px;border-radius:1px;background:var(--ink-3);transform:translateX(-50%)}
.scaleends{position:relative;height:15px;margin-top:var(--s2)}
.scaleends span{position:absolute;transform:translateX(-50%);color:var(--ink-3);white-space:nowrap}

/* SPARK — a trend drawn small, in the family core. The line is data and carries no verdict. */
.spark{display:block;width:100%;height:44px;margin-top:var(--s4)}
.spark path{fill:none;stroke:var(--core,var(--ink));stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke}

/* a marker row's well: its scale, its trend, the facts, the way to every draw */
.mk__in{padding:2px 0 var(--s4)}
.mk__in .facts{grid-template-columns:96px 1fr}
.mk__in .btn--ink{width:100%;margin-top:var(--s4)}

/* CHIPS — Markers' own sub-views, in content, pills that wrap; the current one is ink. They
   used to sit in one row that scrolled sideways with no scrollbar, and at phone width the last
   two were off the right edge with nothing to say so. */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px var(--gutter) 0}
/* four views fit one row at 375 wide (Add a report left the row for a button in Phase 8):
   measured 91 + 90 + 53 + 85 with three gaps against 343 */
.chips button{flex:none;height:36px;padding:0 12px;border-radius:var(--r-pill);background:var(--sunk);color:var(--ink-2);
  font-size:13px;font-weight:640;letter-spacing:-.01em;white-space:nowrap;
  transition:background-color var(--d-state) var(--ez),color var(--d-state) var(--ez)}
.chips button[aria-current="true"]{background:var(--ink);color:var(--enamel)}

/* ---------- the hero: tonight, on a plate --------------------------------
   This was the oven chamber: a dark box with an ember glow breathing at its
   floor. The design system puts ONE saturated card on a light ground instead,
   and light is the identity, so the heat moved to the action and the plate took
   the card. It is the system's lit card now, first in Tonight's stack; what is
   its own is a sheet's radius, the plate seen from above, the meal's name and
   the appliance readout. Nothing here moves because the screen was quiet. */
.hero{border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s6)}
/* the plate seen from above is drawn now (.hero-plate, icons.svg), not implied by rings */
.hero-in{position:relative;z-index:2}

/* RING — one drawing for every arc: the cycle in the masthead, the cover on Kitchen, the cycle
   closing on the sheet. The arc is a dashed circle whose offset is the part still open; it
   moves only when the value did (fillRings), the Fill motion. */
.ring{transform:rotate(-90deg);flex:none;display:block}
.ring circle{fill:none;stroke-linecap:round}
.ring .ring-t{stroke:var(--sunk)}
.ring .ring-a{stroke:var(--sprout);transition:stroke-dashoffset var(--d-hero) var(--ez-out)}
.ring--onlit .ring-t{stroke:rgba(255,255,255,.45)}
.ring--onlit .ring-a{stroke:var(--deep,var(--frost-deep))}
.folio .ring--cycle{margin-right:3px}
.folio .ring--cycle .ring-a{stroke:var(--sprout-deep)}
/* the cover gauge: the ring where the chip stood, the family glyph at its centre */
.gauge{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center}
.gauge .ring{position:absolute;inset:0}
.gauge-in{width:38px;height:38px;border-radius:var(--r-pill);background:rgba(255,255,255,.42);color:var(--on-lit);display:grid;place-items:center}
.gauge-in svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* the passport stamp on a rotation row: how many nights the plate was cooked */
.stampn{position:absolute;right:-3px;bottom:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--enamel);
  font-family:var(--mono);font-size:10px;font-weight:600;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
/* the masthead's two words: the brand, and the meal and cycle count */
.brand{font-family:var(--sans);font-weight:800;letter-spacing:.2em;font-size:11.5px;color:var(--ink)}
.folio{color:var(--ink-3);display:flex;align-items:center;gap:5px}

.hero-eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-lit);opacity:.64}
.hero-eyebrow .pip{width:6px;height:6px;border-radius:50%;background:var(--ember-deep);flex:none}

.mealname{font-size:clamp(40px,12.5vw,56px);line-height:.92;font-weight:800;font-stretch:120%;
  letter-spacing:-.038em;margin:var(--s3) 0 0;text-wrap:balance;color:var(--on-lit)}
.mealsub{font-size:18px;line-height:1.4;color:var(--on-lit);opacity:.76;
  margin-top:var(--s3)}

/* the readout, the appliance panel, now a well inside the card */
.readout{display:grid;grid-template-columns:repeat(3,1fr);margin-top:var(--s5);
  border-radius:var(--r-md);overflow:hidden;background:rgba(255,255,255,.46)}
.readout div{padding:12px 13px}
.readout div+div{border-left:1px solid rgba(255,255,255,.62)}
.readout .v{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.05;
  font-variant-numeric:tabular-nums;color:var(--on-lit)}
.readout .v.word{font-family:var(--sans);font-size:18px;font-weight:700;font-stretch:110%;
  color:var(--on-lit)}
.readout .v .u{font-size:12px;opacity:.58;margin-left:2px}
.readout .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  opacity:.56;margin-top:6px}

/* ---------- cook ---------------------------------------------------------- */
.tray{font-size:16px;line-height:1.55;color:var(--ink-2);
  background:var(--sunk);border-radius:var(--r-sm);padding:14px 16px;margin-top:var(--s4)}
.steps{display:flex;flex-direction:column;gap:15px;counter-reset:s;margin-top:var(--s4)}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--mono);
  font-size:12.5px;color:var(--ember-ink);font-weight:500;padding-top:3px}
.steps li p{font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.steps li b{color:var(--ink);font-weight:600}

/* the tick beside a cold row: a well, and the family's deep tone when checked, the one fill
   that takes the mark. A tick tracks progress and moves no stock, and the card says so. */
.tick{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border-radius:var(--r-xs);
  background:var(--sunk);cursor:pointer;position:relative;margin:0;
  transition:background-color var(--d-state) var(--ez),transform var(--d-press) var(--ez)}
.tick:checked{background:var(--deep,var(--frost-deep))}
.tick:active{transform:scale(.9)}
.tick:checked::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;
  border:solid var(--on-deep);border-width:0 2px 2px 0;transform:rotate(42deg)}
.tick~.row__body{cursor:pointer}
/* where a tick means done (a slot eaten, a pantry item owned) the title recedes; where it
   means in play (a store) nothing does */
.tick--done:checked~.row__body .row__title{color:var(--ink-3)}


/* ---------- the gate rail: one segment per unit of stock standing between a lab result and
   the slot it wants to change, in the family core; a segment goes when that stock does ---- */
.gate{margin-top:var(--s4)}
.gaterail{display:flex;gap:3px;height:10px}
.gaterail i{flex:1;background:var(--core,var(--plum));border-radius:2px;
  transition:background-color var(--d-hero) var(--ez),transform var(--d-hero) var(--ez);transform-origin:bottom}
.gaterail i.gone{background:color-mix(in srgb,var(--core,var(--plum)) 18%, transparent);transform:scaleY(.45)}
.gatecap{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);
  font-size:11px;letter-spacing:.05em;color:var(--fam-ink,var(--ink-3));text-transform:uppercase}


/* ---------- controls ------------------------------------------------------ */
.actions{display:flex;flex-direction:column;gap:10px}
/* BUTTON — a pill. The default is a well; ink is the commitment on a white or lit card;
   solid is the family's deep tone with white text, the raised action, heat and only heat. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:46px;
  padding:0 var(--s5);border-radius:var(--r-pill);font-weight:640;font-size:15px;letter-spacing:-.01em;
  background:var(--sunk);color:var(--ink);
  transition:transform var(--d-press) var(--ez),box-shadow var(--d-press) var(--ez),background-color var(--d-state) var(--ez)}
.btn--solid{background:var(--deep);color:var(--on-deep);box-shadow:0 2px 8px color-mix(in srgb,var(--deep) 34%, transparent)}
.btn--ink{background:var(--ink);color:var(--enamel)}
.btn--quiet{background:transparent;color:var(--fam-ink,var(--ink-2));padding:0 var(--s3);min-height:38px}
.btn--sm{min-height:34px;padding:0 var(--s4);font-size:13px}
.btn:active,.btn.pressed{transform:scale(.962);box-shadow:0 1px 3px rgba(18,21,14,.10)}
.btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.iconbtn{width:38px;height:38px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);
  display:grid;place-items:center;box-shadow:var(--lift-1);flex:none;transition:transform var(--d-press) var(--ez)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.iconbtn--onlit{background:rgba(255,255,255,.5);color:var(--on-lit);box-shadow:none}

/* the one daily button: ember's deep tone, and the only white text on Tonight */
.btn-eat{background:linear-gradient(180deg,var(--ember-deep),var(--ember-ink));color:var(--on-deep);
  font-size:18px;font-weight:700;min-height:60px;position:relative;overflow:hidden;
  box-shadow:0 4px 16px color-mix(in srgb,var(--ember-deep) 38%, transparent)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow .btn{min-height:44px;font-size:14px;padding:0 var(--s3)}

/* ---------- THE SETTLE: the log moment. The fire canvas and the words that ride over it
   are the page's own, because they fill the viewport; this is the hero settling under them. */
.settling .mealname{animation:readin .66s var(--ez) both}
.settling .mealsub{animation:readin .66s var(--ez) .06s both}
.settling .readout{animation:readin .66s var(--ez) .12s both}
@keyframes readin{from{opacity:0;transform:translateY(24px)}}

/* a card that arrives after the action: the one-time note, a trade's undo line */
.arrive{animation:slidein var(--d-enter) var(--ez-out) both}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}}

/* ---------- rows that open in place (the rotation, the markers) ------------ */
.exp{border-top:1px solid var(--hair)}
.exp:first-child{border-top:0}
.chev{width:11px;height:11px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .28s var(--ez);margin-right:4px;flex:none}
.exp.open .chev{transform:rotate(-135deg)}
.exp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ez)}
.exp.open .exp-b{grid-template-rows:1fr}
.exp-b>div{overflow:hidden}
.exp-in{padding:2px 0 18px}

/* ---------- the rotation: rows that open in place, a well of readings, the facts ---------- */
.rows{margin-top:var(--s2)}
/* a rotation row's meta carries the meal number and the oven settings, so it wraps rather than
   losing the minutes to an ellipsis when a pill sits beside it; a marker's name wraps for the
   same reason, because "Triglyceride:HDL ratio (mmol/L)" cut short is a different marker */
.rows .row__meta,.rows .row__title{white-space:normal;text-overflow:clip;overflow-wrap:anywhere}
.rot__in{padding:2px 0 var(--s4)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);background:var(--sunk);
  border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.stats--2{grid-template-columns:1fr 1fr;gap:var(--s4) var(--s3)}
.facts{display:grid;grid-template-columns:80px 1fr;gap:7px var(--s3);margin:var(--s4) 0 0}
.facts dt{font-size:11px;line-height:1;font-weight:680;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-top:4px}
.facts dd{margin:0;font-size:14.5px;line-height:1.42;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
.rot__in .btn--ink{width:100%;margin-top:var(--s4)}


/* the undo line: a trade is reversible and says so in place, in the cold family's wash */
.undoline{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;
  background:var(--wash,var(--frost-wash));border-radius:var(--r-sm);padding:var(--s3) var(--s4)}
.undoline span{font-size:13.5px;line-height:1.4;color:var(--ink-2)}

/* the hero answers the log: a punch on the commitment curve */
.punch{animation:punch .42s var(--ez-spring)}
@keyframes punch{0%{transform:scale(1)}38%{transform:scale(.955)}100%{transform:scale(1)}}

/* ---------- the one nav --------------------------------------------------- */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 14px rgba(14,20,22,.06)}
.nav button{height:var(--navh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em;
  transition:color .18s var(--ez)}
.nav button .gl{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  transition:stroke .18s var(--ez),transform .26s var(--ez)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .gl{stroke:var(--ember);transform:translateY(-1px) scale(1.06)}


/* ==========================================================================
   ONE APP. The Mac is the same page with more room, not a different app.
   Everything below is what the big screen used to keep to itself: the full
   chart, the tables, the forms. They are the same components at both sizes.
   ========================================================================== */

/* ---------- the chart. The line is ink, because ink is data. The researched target is a
   band in the markers family's lit tone; the lab's own printed range is a dashed line beneath
   it, never a colour of its own, because it is the lab's word not this app's. Out of target
   is a triangle in ember: a state, the same one the pill shows. ------------------------ */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:11px;fill:var(--ink-3);letter-spacing:.04em}
svg.chart text.val{font-size:13px;fill:var(--ink);font-weight:500;letter-spacing:0}
svg.chart text.ok{fill:var(--fam-ink,var(--plum-ink))}
.c-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-grid{stroke:var(--hair);stroke-dasharray:1 4;shape-rendering:crispEdges}
.c-frame{stroke:var(--ink-3);stroke-opacity:.55;shape-rendering:crispEdges}
.c-edge{stroke:var(--hair);shape-rendering:crispEdges}
.c-band{fill:var(--lit,var(--plum-lit));opacity:.32}
.c-bandedge{stroke:var(--core,var(--plum));shape-rendering:crispEdges}
.c-lab{stroke:var(--ink-3);stroke-dasharray:5 4;fill:none;shape-rendering:crispEdges}
.c-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.8}
.c-dot.last{fill:var(--ink)}
.c-out{fill:var(--ember)}
.c-rug{stroke:var(--ink-3);stroke-opacity:.55;shape-rendering:crispEdges}
.c-lattice{stroke:var(--hair);stroke-width:1;shape-rendering:crispEdges}
.c-cross{stroke:var(--ink-3);shape-rendering:crispEdges}
.c-hit{fill:transparent;cursor:crosshair}
.c-hit:focus-visible{outline:2px solid var(--ember);outline-offset:0;border-radius:0}
.c-hit:focus-visible + .c-halo{stroke:var(--ink);stroke-width:2;fill:none}
.c-read{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:12px;min-height:22px;
  font-size:14px;color:var(--ink-2)}
.c-read .mono{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.c-read .val{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink)}
.c-read .st{display:inline-flex;align-items:center;gap:7px}
.c-read .i.up{transform:rotate(-90deg)}
.c-read .i.dn{transform:rotate(90deg)}
.c-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.c-key span{display:inline-flex;align-items:center;gap:7px}
.mark{display:inline-block;width:9px;height:9px;flex:none}
.mark.out{background:var(--ember);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mark.low{background:var(--frost);clip-path:polygon(50% 100%,100% 0,0 0)}
.mark.in{border:1.5px solid var(--core,var(--plum));background:none;border-radius:50%}
.mark.none{height:0;border-top:1.5px solid var(--ink-3)}

/* ---------- tables: rules and alignment, no zebra, no vertical borders ---------------- */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--s5));padding:0 var(--s5)}
table.data{border-collapse:collapse;width:100%;font-size:14px}
table.data th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--hair);white-space:nowrap}
table.data td{padding:10px 10px;border-bottom:1px solid var(--hair);color:var(--ink-2);vertical-align:top;
  line-height:1.4}
table.data th:first-child,table.data td:first-child{padding-left:0}
table.data th:last-child,table.data td:last-child{padding-right:0}
table.data td.n,table.data th.n{text-align:right;font-family:var(--mono);
  font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
table.data tr.excl td{color:var(--ink-3)}
table.data td.wrap{white-space:normal;min-width:180px}
/* .pill is a component now (above); .pill.hot and .pill.ok are restated there */
.strike{text-decoration:line-through}

/* ---------- the counter on the ingest preview: the two states that need a decision sit
   above the three that do not, and nothing is told apart by hue alone ------------------ */
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.ctr-g{display:grid;gap:1px;background:var(--hair);border-radius:12px;overflow:hidden}
.ctr-c{background:var(--surface);padding:11px 13px;display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
.ctr-c .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ctr-c .v{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink-3)}
.ctr-c.on .v{color:var(--ink)}
.ctr-c.need .k,.ctr-c.need .v{color:var(--ember-ink)}
.callout{border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:14.5px;line-height:1.5;margin:var(--s3) 0;
  background:var(--sunk);color:var(--ink-2)}
.callout.warn{background:var(--ember-wash);color:var(--ember-ink)}

    if(m)m.content=dark?'#101415':'#F1F3F2';
  }
  paint(choice());
  window.plateThemeChoice=choice;
  window.plateTheme=function(v){
    const now=(v==='light'||v==='dark')?v:'auto';
    try{localStorage.setItem(K,now);localStorage.setItem(V,'3');}catch(e){}
    paint(now);
  };
  if(MQ&&MQ.addEventListener)MQ.addEventListener('change',()=>{if(choice()==='auto')paint('auto');});
  window.addEventListener('storage',e=>{if(e.key===K)paint(choice());});
})();
</script>

     aria-hidden and always has a word beside it: no icon here is the only carrier of meaning.
